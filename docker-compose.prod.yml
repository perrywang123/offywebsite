# Production compose file. Brings up the app with a persistent SQLite volume
# and auto-restart. Values use `${VAR:-default}` substitution, driven by a
# `.env` file in this directory (see .env.production.example).
#
#   cp .env.production.example .env
#   docker compose -f docker-compose.prod.yml up -d --build
#
# app/admin bind to loopback 3000/3001; keep both private behind Nginx TLS.
# Independent storefront: bash deploy/update-storefront.sh --kol
# Independent admin: bash deploy/update-admin.sh (after KOL-capable app is healthy)
# Initial KOL setup may use those two commands in order, or bash deploy/update.sh --kol.
# Keep the same checkout/Compose project to preserve offy-data.
services:
  app: &offy-app
    image: offy-app:local
    build:
      context: .
      dockerfile: Dockerfile
      # 构建期只传公开配置；商业数据仅来自Shopify，故障显示重试态。
      # 密钥类走下面的environment，
      # 不进构建参数(构建参数会留在镜像 history 里)。
      args:
        OFFY_BUILD_REVISION: "${OFFY_BUILD_REVISION:-unknown}"
        SITE_URL: "${SITE_URL:-http://localhost:3000}"
        NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-Offy}"
        NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://offy.example.com}"
        SHOPIFY_STORE_DOMAIN: "${SHOPIFY_STORE_DOMAIN:-}"
        SHOPIFY_STOREFRONT_TOKEN: "${SHOPIFY_STOREFRONT_TOKEN:-}"
        SHOPIFY_API_VERSION: "${SHOPIFY_API_VERSION:-2026-07}"
        SHOPIFY_MARKET_COUNTRY: "${SHOPIFY_MARKET_COUNTRY:-US}"
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    environment: &offy-runtime-env
      NODE_ENV: production
      DATABASE_PROVIDER: sqlite
      DATABASE_URL: "${DATABASE_URL:-/data/offy.db}"
      CHECKOUT_DIAGNOSTICS_KEY: "${CHECKOUT_DIAGNOSTICS_KEY:-}"
      META_TRACKING_ENABLED: "${META_TRACKING_ENABLED:-false}"
      META_PIXEL_ID: "${META_PIXEL_ID:-}"
      META_CAPI_ENABLED: "${META_CAPI_ENABLED:-false}"
      META_CAPI_ACCESS_TOKEN: "${META_CAPI_ACCESS_TOKEN:-}"
      META_GRAPH_API_VERSION: "${META_GRAPH_API_VERSION:-v26.0}"
      META_CAPI_TEST_EVENT_CODE: "${META_CAPI_TEST_EVENT_CODE:-}"
      META_CATALOG_IDS: "${META_CATALOG_IDS:-}"
      META_WORKER_SECRET: "${META_WORKER_SECRET:-}"
      NEXT_PUBLIC_SITE_NAME: "${NEXT_PUBLIC_SITE_NAME:-Offy}"
      NEXT_PUBLIC_SITE_URL: "${NEXT_PUBLIC_SITE_URL:-https://offy.example.com}"
      # 服务端真正读的是 SITE_URL(robots / sitemap / metadataBase,以及
      # Stripe/PayPal 的回跳地址),不是 NEXT_PUBLIC_SITE_URL。漏了这行会让容器里
      # 一直回落到 http://localhost:3000,线上 sitemap 和结算回跳都会指错域名。
      SITE_URL: "${SITE_URL:-http://localhost:3000}"
      # ---- Shopify:商品目录与结算都走 Storefront API ----
      # 这几项不传时不展示商品事实，也不创建Shopify支付会话。
      SHOPIFY_STORE_DOMAIN: "${SHOPIFY_STORE_DOMAIN:-}"
      SHOPIFY_STOREFRONT_TOKEN: "${SHOPIFY_STOREFRONT_TOKEN:-}"
      SHOPIFY_ADMIN_TOKEN: "${SHOPIFY_ADMIN_TOKEN:-}"
      SHOPIFY_API_VERSION: "${SHOPIFY_API_VERSION:-2026-07}"
      SHOPIFY_MARKET_COUNTRY: "${SHOPIFY_MARKET_COUNTRY:-US}"
      GEO_TRUSTED_COUNTRY_HEADER: "${GEO_TRUSTED_COUNTRY_HEADER:-}"
      GEOIP_COUNTRY_DATABASE: "${GEOIP_COUNTRY_DATABASE:-/data/GeoLite2-Country.mmdb}"
      KOL_ADMIN_BOOTSTRAP_HASH: "${KOL_ADMIN_BOOTSTRAP_HASH:-}"
      KOL_ACCOUNTING_MODE: "${KOL_ACCOUNTING_MODE:-offy}"
      SHOPIFY_ANALYTICS_SHOP_ID: "${SHOPIFY_ANALYTICS_SHOP_ID:-}"
      SHOPIFY_STOREFRONT_ID: "${SHOPIFY_STOREFRONT_ID:-}"
      KOL_ENABLED: "${KOL_ENABLED:-false}"
      KOL_SETTLEMENTS_ENABLED: "${KOL_SETTLEMENTS_ENABLED:-false}"
      ADMIN_ORIGIN: "${ADMIN_ORIGIN:-https://admin.offy.example.com:8443}"
      KOL_INGRESS_SECRET: "${KOL_INGRESS_SECRET:-}"
      KOL_SIGNING_SECRET: "${KOL_SIGNING_SECRET:-}"
      KOL_WORKER_SECRET: "${KOL_WORKER_SECRET:-}"
      SHOPIFY_WEBHOOK_SECRET: "${SHOPIFY_WEBHOOK_SECRET:-}"
      # ---- 支付渠道:留空则对应渠道自动禁用 ----
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      PAYPAL_MODE: "${PAYPAL_MODE:-sandbox}"
      PAYPAL_CLIENT_ID: "${PAYPAL_CLIENT_ID:-}"
      PAYPAL_CLIENT_SECRET: "${PAYPAL_CLIENT_SECRET:-}"
    volumes:
      - offy-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Same source and database, independent image/container lifecycle.
  admin:
    <<: *offy-app
    profiles: [kol]
    image: offy-admin:local
    # Admin application secrets are runtime-only; never inherited by app or build args.
    environment:
      <<: *offy-runtime-env
      SHOPIFY_ADMIN_CLIENT_ID: "${SHOPIFY_ADMIN_CLIENT_ID:-}"
      SHOPIFY_ADMIN_CLIENT_SECRET: "${SHOPIFY_ADMIN_CLIENT_SECRET:-}"
    ports:
      - "127.0.0.1:3001:3000"

  meta-worker:
    profiles: [meta]
    image: offy-app:local
    pull_policy: never
    restart: always
    entrypoint: ["node", "scripts/meta-worker.mjs"]
    cpus: 0.25
    mem_limit: 96m
    environment:
      META_WORKER_URL: http://app:3000/api/meta/worker
      META_WORKER_SECRET: "${META_WORKER_SECRET:-}"
      KOL_WORKER_SECRET: "${KOL_WORKER_SECRET:-}"
    depends_on:
      app:
        condition: service_healthy

  kol-worker:
    profiles: [kol]
    image: offy-admin:local
    pull_policy: never
    restart: always
    entrypoint: ["node", "scripts/kol-worker.mjs"]
    environment:
      KOL_WORKER_URL: http://admin:3000/api/kol/worker
      KOL_WORKER_SECRET: "${KOL_WORKER_SECRET:-}"
    depends_on:
      admin:
        condition: service_healthy

volumes:
  offy-data:

# Optional host-side deployment metadata; never passed to the application/browser.
# Select an ACTIVE site config explicitly before allowing the deploy script to replace it.
x-offy-deploy:
  build_cpus: "${DEPLOY_BUILD_CPUS:-1}"
  build_memory_mb: "${DEPLOY_BUILD_MEMORY_MB:-1536}"
  nginx_config: "${DEPLOY_NGINX_CONFIG:-}"
  site_tls_certificate: "${DEPLOY_SITE_TLS_CERTIFICATE:-}"
  site_tls_key: "${DEPLOY_SITE_TLS_KEY:-}"
  admin_tls_certificate: "${DEPLOY_ADMIN_TLS_CERTIFICATE:-}"
  admin_tls_key: "${DEPLOY_ADMIN_TLS_KEY:-}"
  ca_file: "${DEPLOY_CA_FILE:-}"
