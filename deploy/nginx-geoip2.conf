# GeoIP2 for the Offy reverse proxy — OPTIONAL, opt-in.
#
# ⚠️ 自 2026-10-11 起**这个文件不再是必需品**:应用会自己按客户端 IP 解析国家
#    (src/lib/geo.ts 用 geoip-lite,数据库随 npm 包发布)。本文件只在你想让
#    **nginx 覆盖**应用判定时才用 —— 例如内网压测要伪装成某个国家、或想让 CDN
#    之外再加一层判定。不装它,币种与「区域限定」已经会跟着访客走。
#
# ─────────────────────────────────────────────────────────────────────────────
# 为什么曾经需要这个文件
#
# 站点按访客国家决定两件事:展示哪些「区域限定」商品、以及用什么币种显示价格。
# 国家来源按优先级(见 src/lib/geo.ts):
#
#     cf-ipcountry → x-vercel-ip-country → x-country-code → x-geo-country
#                  → x-forwarded-country → **应用自己按客户端 IP 解析**(geoip-lite)
#                  → $SHOPIFY_MARKET_COUNTRY(默认 US)
#
# 也就是说:**国家头只在存在时才优先**,一个都没有时应用不会再一律落到默认市场,
# 而是自己查 IP。所以裸 nginx、不挂 Cloudflare 也能正确按地区展示。
# ─────────────────────────────────────────────────────────────────────────────
#
# 安装(Debian/Ubuntu;**只有你确实要用 nginx 覆盖判定时才做这些**,
#        而且需要 MaxMind 账号 —— 这也是应用改成自己解析 IP 的原因):
#
#     apt install libnginx-mod-http-geoip2 geoipupdate
#     # 在 /etc/geoipupdate/GeoIP.conf 里填 MaxMind 的 AccountID / LicenseKey,
#     # 然后拉一次库:
#     geoipupdate
#
# 装好后把这个文件放到 /etc/nginx/conf.d/offy-geoip2.conf(它属于 http {} 块),
# 再把 deploy/nginx.conf 里那行 proxy_set_header X-Country-Code 打开。
#
# ⚠️ 顺序很重要:先装模块与库,再让下面这段生效。反过来(先加这段、模块没装)
#    nginx -t 会直接失败 —— reload 不会生效,但你会看到一个起不来的配置。
#
# 验证(务必先跑这个,再 reload):
#
#     nginx -t
#     systemctl reload nginx
#
#     # 从外部请求,看国家头有没有真的传到应用:
#     curl -s -o /dev/null -D - https://你的域名/api/products | grep -i x-country-code
#
#     # 应用侧的最终确认:两个不同国家的价格应当不同
#     curl -s https://你的域名/api/products | head -c 300
#
# 都没问题后,用不同地区的网络(或把 X-Country-Code 手动设成 GB/HK)访问首页,
# 「区域限定」那一栏的商品应该随地区变化,价格币种也应随之改变。
# ─────────────────────────────────────────────────────────────────────────────

geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
    auto_reload 7d;
    $geoip2_data_country_code country iso_code;
}
