# Reverse proxy for Offy. Drop into /etc/nginx/sites-available/offy and enable
# it, then run `certbot --nginx -d offy.example.com` to add the 443/TLS block
# automatically.
#
# 国家判定:自 2026-10-11 起**应用可自行按访客 IP 解析国家**
# (src/lib/geo.ts + geoip-lite,数据随 npm 包发布),所以本文件默认不需要
# GeoIP2 模块、也不需要 Cloudflare。本文件里的 X-Country-Code 只在你想让
# nginx 覆盖应用判定时才用。详见下面 `location /` 里的注释。
server {
    listen 80;
    listen [::]:80;
    server_name offy.example.com;

    # ACME http-01 challenge for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 按访客国家展示「区域限定」与对应币种 ----
        # 自 2026-10-11 起**应用自己会按客户端 IP 解析国家**(src/lib/geo.ts 用
        # geoip-lite,数据库随 npm 包发布),所以本文件默认什么都不用做:不装 nginx
        # GeoIP2 模块、不接 Cloudflare,币种与「区域限定」也会跟着访客走。
        #
        # 唯一的要求是上面那两行必须留着 —— 应用要靠它们拿到客户端 IP:
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #
        # 应用侧的完整优先级(见 src/lib/geo.ts):
        #     cf-ipcountry → x-vercel-ip-country → x-country-code → x-geo-country
        #     → x-forwarded-country → **按客户端 IP 自行解析** → SHOPIFY_MARKET_COUNTRY(默认 US)
        # 也就是:有国家头时仍然以头为准,IP 解析只是这几级都拿不到时才走的兜底层。
        #
        # 想用 nginx 覆盖判定(例如内网压测要伪装成别的国家)才需要下面这行 +
        # deploy/nginx-geoip2.conf。**装不了 GeoIP2 模块的发行版请保持它注释掉**:
        # libnginx-mod-http-geoip2 是 Debian/Ubuntu 的包名,OpenCloudOS/RHEL 系没有,
        # 模块没装就打开这行,`nginx -t` 会直接报 unknown directive "geoip2" —— 本站
        # 已经在生产上踩过一次(先加配置后装模块,顺序反了)。
        #
        # 验证:
        #    curl -s http://127.0.0.1:3000/api/products | head -c 200
        #    两个不同地区的网络访问首页,「区域限定」商品与价格币种应当不同。
        # proxy_set_header X-Country-Code $geoip2_data_country_code;

    }
}
