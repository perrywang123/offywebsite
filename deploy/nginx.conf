# Reverse proxy for Offy. Drop into /etc/nginx/sites-available/offy and enable
# it, then run `certbot --nginx -d offy.example.com` to add the 443/TLS block
# automatically.
server {
    listen 80;
    listen [::]:80;
    server_name offy.example.com;

    # ACME http-01 challenge for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 按访客国家展示「区域限定」与对应币种 ----
        # 应用从请求头判定国家(优先级见 src/lib/geo.ts):cf-ipcountry →
        # x-vercel-ip-country → x-country-code → x-geo-country → x-forwarded-country
        # 一个都拿不到时按 SHOPIFY_MARKET_COUNTRY(默认 US)展示,不会白屏 ——
        # 但**币种会是错的**,区域限定那一栏也不是访客所在地区的。
        #
        # 二选一:
        #
        # A) 域名挂 Cloudflare —— 最省事。CF 自动注入 cf-ipcountry,本文件不用改,
        #    下面那行保持注释即可。
        #
        # B) 裸 nginx —— 需要 GeoIP2。步骤见 deploy/nginx-geoip2.conf:
        #      1. apt install libnginx-mod-http-geoip2 geoipupdate && geoipupdate
        #      2. 把 deploy/nginx-geoip2.conf 放到 /etc/nginx/conf.d/
        #      3. 打开下面这行
        #      4. nginx -t && systemctl reload nginx
        #
        #    顺序不能反:模块/库没装好就打开下面这行,nginx -t 会失败。
        #
        # 验证(任选其一,做完 A 或 B 后都该跑一次):
        #    curl -s -o /dev/null -D - https://你的域名/api/products | grep -i country
        #    两个不同地区的网络访问首页,「区域限定」商品与价格币种应当不同。
        proxy_set_header X-Country-Code $geoip2_data_country_code;

    }
}
