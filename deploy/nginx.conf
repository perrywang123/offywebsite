# Reverse proxy for Offy. Drop into /etc/nginx/sites-available/offy and enable
# it, then run `certbot --nginx -d offy.example.com` to add the 443/TLS block
# automatically.
server {
    listen 80;
    listen [::]:80;
    server_name offy.example.com;

    # ACME http-01 challenge for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- 「区域限定」按访客国家展示(route A)----
        # 应用从请求头判定国家(优先级见 src/lib/geo.ts):cf-ipcountry →
        # x-vercel-ip-country → x-country-code → x-geo-country → x-forwarded-country
        # 一个都拿不到时按 SHOPIFY_MARKET_COUNTRY(默认 US)展示,不会白屏。
        # 三选一:
        #
        # A) 域名挂 Cloudflare —— 最省事,CF 自动注入 cf-ipcountry,本文件不用改。
        #
        # B) nginx 自带 GeoIP2 —— 需要 ngx_http_geoip2_module 与 MaxMind 的
        #    GeoLite2-Country.mmdb。在 http {} 块里加:
        #        geoip2 /usr/share/GeoIP/GeoLite2-Country.mmdb {
        #          auto_reload 7d;
        #          $geoip2_data_country_code country iso_code;
        #        }
        #    然后把下面这行取消注释:
        # proxy_set_header X-Country-Code $geoip2_data_country_code;
        #
        # C) 都不做 —— 全部访客按默认市场展示,区域限定那一栏仍有内容。
    }
}
