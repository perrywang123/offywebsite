# Reverse proxy for Offy. Drop into /etc/nginx/sites-available/offy and enable
# it, then run `certbot --nginx -d offy.example.com` to add the 443/TLS block
# automatically.
server {
    listen 80;
    listen [::]:80;
    server_name offy.example.com;

    # ACME http-01 challenge for certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
