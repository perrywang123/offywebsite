# Complete two-ingress example; adapt server names, certificates and a NEW random
# secret matching KOL_INGRESS_SECRET. Do not commit the rendered secret config.
# Keep app/admin source ports 3000/3001 bound to loopback. Test with nginx -t before applying.
server {
    listen 80;
    server_name offy.example.com;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://offy.example.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name offy.example.com;
    ssl_certificate /etc/letsencrypt/live/offy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/offy.example.com/privkey.pem;
    if ($host != offy.example.com) { return 444; }
    location ~* "^/(?:[a-z]{2}(?:-[a-z]{2})?/)?(?:admin|api/admin)(?:/|$)" { return 404; }
    location = /api/kol/worker { return 404; }
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Offy-Admin-Ingress "";
        proxy_set_header X-Middleware-Subrequest "";
    }
}
server {
    listen 8443 ssl;
    server_name admin.offy.example.com;
    ssl_certificate /etc/letsencrypt/live/admin.offy.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.offy.example.com/privkey.pem;
    if ($host != admin.offy.example.com) { return 444; }
    # Optional operator IP allowlist goes here (allow ...; deny all;).
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-store, private" always;
    location ~ ^/(?:admin(?:/|$)|api/admin/kol(?:/|$)|_next/(?:static|image)(?:/|$)) {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Offy-Admin-Ingress "REPLACE_WITH_RANDOM_INGRESS_SECRET_AT_LEAST_32_CHARS";
        proxy_set_header X-Middleware-Subrequest "";
        proxy_read_timeout 120s;
    }
    location / { return 404; }
}
