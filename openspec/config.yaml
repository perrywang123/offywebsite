schema: spec-driven

context: |
  Baseline: 2026-10-31. Offy/is.offy is a brand storefront with commerce already implemented.
  Next.js 15 App Router, React 19, TypeScript, Tailwind CSS v4, next-intl, Shopify Storefront API,
  Drizzle with implemented SQLite only, zod, Vitest + Testing Library, pnpm.
  Public locale: en only, with unprefixed public paths; zh code remains but is not routed.
  Shopify is the sole commercial product source. Local catalog fallback has been removed;
  unavailable-state design was approved and implemented. See archived change
  2026-10-31-shopify-authoritative-catalog and docs/shopify-authority-validation.md.
  Main purchase UI uses Shopify hosted checkout; retained Stripe/PayPal paths are USD-only.
  Shopify orders are not synchronized into the local DB. Local DB stores newsletter and legacy payments.
  Admin, opt-in KOL/Collabs, signed Shopify webhook reconciliation and checkout diagnostics are implemented.
  Optional Meta funnel/outbox diagnostics are implemented separately from general BI. PostgreSQL is not implemented.
  Read AGENTS.md, DESIGN.md, docs/current-state.md and docs/roadmap.md before related work.
  Conventional Commits. Server configuration via src/lib/env.ts. Do not expose credentials.

rules:
  proposal:
    - Keep scope focused; distinguish implemented facts from approved targets and unapproved designs.
    - Include Why, What Changes, Capabilities and Impact with concrete affected paths.
  tasks:
    - Keep implementation steps small and follow failing test, minimal implementation, refactor.
    - Do not mark user approval, runtime implementation or external verification complete without evidence.

operations:
  apply:
    guidance:
      - Follow spec-first and red-green-refactor for behavior changes; docs-only changes use skip_specs.
      - A request to approve a design is not approval to implement it.
      - Keep pnpm test green before committing; run relevant typecheck, lint, build and browser checks.
  archive:
    guidance:
      - Merge only implemented deltas, then verify the main spec still matches the current code.
      - Do not archive superseded deltas over a newer corrected baseline.
