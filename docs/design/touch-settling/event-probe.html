<!doctype html><html lang="en"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Offy native touch event probe</title><style>body{font:16px system-ui;margin:0;padding:20px}#surface{height:220px;background:#ddd;touch-action:pan-y pinch-zoom;display:grid;place-items:center;border:2px solid #333}pre{white-space:pre-wrap;font-size:12px}button{padding:12px}</style><h1>Native touch probe</h1><div id="surface" aria-label="Swipe test surface">Swipe horizontally here</div><button id="reset">Clear log</button><pre id="log">No input yet.</pre><script>
const surface=document.querySelector('#surface'),log=document.querySelector('#log');let rows=[];for(const type of ['pointerdown','gotpointercapture','pointermove','pointerup','lostpointercapture','pointercancel','touchstart','touchmove','touchend','touchcancel','click'])surface.addEventListener(type,event=>{if(rows.length>50)return;const t=event.changedTouches?.[0]??event;rows.push(`${event.type} pointer=${event.pointerType??'-'} id=${event.pointerId??'-'} touches=${event.touches?.length??'-'} x=${Math.round(t.clientX??0)}`);log.textContent=rows.join('\n')});document.querySelector('#reset').onclick=()=>{rows=[];log.textContent='No input yet.'};
</script></html>
